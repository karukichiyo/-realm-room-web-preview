name: Deploy Realm Room Web

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-realm-room.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: realm-room-pages
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Download verified Godot Web build
        run: curl --fail --location --retry 3 'https://sdmntpraustraliaeast.oaiusercontent.com/files/00000000-2180-81fa-8b07-1e09be295a17/raw?se=2026-09-16T06%3A09%3A45Z&sp=r&sv=2026-02-06&sr=b&scid=01a0a8cc-f0b5-71ed-a24e-be6a2bf90ce8&skoid=9063adf3-a524-4acf-b70a-8731b33f2f50&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-15T22%3A01%3A28Z&ske=2026-09-16T22%3A01%3A28Z&sks=b&skv=2026-02-06&sig=TKEK31gwcbnoRMjYxC%2BMygqt0gY%2BfcEsc%2BF35UB98SA%3D' --output realm-room-web.zip
      - name: Extract site
        run: |
          mkdir -p site
          unzip -q realm-room-web.zip -d site
          test -f site/index.html
          test -f site/index.wasm
          test -f site/index.pck
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: prepare
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
