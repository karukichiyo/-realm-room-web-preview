name: Deploy Realm Room Web

on:
  workflow_dispatch:
  repository_dispatch:
    types: [realm-room-web-preview]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: realm-room-pages
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Download verified Web release
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW_TAG: ${{ github.event.release.tag_name || 'realm-room-web-preview' }}
        run: |
          gh release download "$PREVIEW_TAG" \
            --repo karukichiyo/-realm-room-web-preview \
            --pattern realm-room-web.zip \
            --output realm-room-web.zip
      - name: Extract site
        run: |
          mkdir -p site
          unzip -q realm-room-web.zip -d site
          test -f site/index.html
          test -f site/index.wasm
          test -f site/index.pck
          source_sha="${{ github.event.client_payload.source_sha || github.sha }}"
          revision="${source_sha:0:12}"
          runtime="realm-room-${revision}"
          mv site/index.pck "site/${runtime}.pck"
          mv site/index.wasm "site/${runtime}.wasm"
          mv site/index.audio.worklet.js "site/${runtime}.audio.worklet.js"
          mv site/index.audio.position.worklet.js "site/${runtime}.audio.position.worklet.js"
          sed -i -e 's/"executable":"index"/"executable":"'"${runtime}"'"/' -e 's/"index.pck"/"'"${runtime}"'.pck"/' -e 's/"index.wasm"/"'"${runtime}"'.wasm"/' site/index.html
          test -f "site/${runtime}.pck"
          cat > site/sw.js <<EOF
          const CACHE_NAME = "realm-room-${revision}";
          const CORE_FILES = ["${runtime}.wasm", "${runtime}.pck"];

          self.addEventListener("install", () => self.skipWaiting());

          self.addEventListener("activate", (event) => {
            event.waitUntil(
              caches.keys()
                .then((keys) => Promise.all(
                  keys
                    .filter((key) => key.startsWith("realm-room-") && key !== CACHE_NAME)
                    .map((key) => caches.delete(key))
                ))
                .then(() => self.clients.claim())
            );
          });

          self.addEventListener("fetch", (event) => {
            if (event.request.method !== "GET") return;
            const url = new URL(event.request.url);
            const isCoreFile = CORE_FILES.some((file) => url.pathname.endsWith("/" + file));
            if (!isCoreFile) return;

            event.respondWith(
              caches.open(CACHE_NAME).then(async (cache) => {
                const cached = await cache.match(event.request);
                if (cached) return cached;
                const response = await fetch(event.request);
                if (response.ok) await cache.put(event.request, response.clone());
                return response;
              })
            );
          });
          EOF
          sed -i 's#</body>#<script>if ("serviceWorker" in navigator) { navigator.serviceWorker.register("./sw.js"); }</script></body>#' site/index.html
          test -f site/sw.js
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: prepare
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
