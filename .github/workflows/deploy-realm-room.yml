name: Deploy Realm Room Web

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: realm-room-pages
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Download verified Web release
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW_TAG: ${{ github.event.release.tag_name || 'realm-room-web-preview' }}
        run: |
          gh release download "$PREVIEW_TAG" \
            --repo karukichiyo/-realm-room-web-preview \
            --pattern realm-room-web.zip \
            --output realm-room-web.zip
      - name: Extract site
        run: |
          mkdir -p site
          unzip -q realm-room-web.zip -d site
          test -f site/index.html
          test -f site/index.wasm
          test -f site/index.pck
          revision="${GITHUB_SHA:0:12}"
          runtime="realm-room-${revision}"
          mv site/index.pck "site/${runtime}.pck"
          mv site/index.wasm "site/${runtime}.wasm"
          mv site/index.audio.worklet.js "site/${runtime}.audio.worklet.js"
          mv site/index.audio.position.worklet.js "site/${runtime}.audio.position.worklet.js"
          sed -i -e 's/"executable":"index"/"executable":"'"${runtime}"'"/' -e 's/"index.pck"/"'"${runtime}"'.pck"/' -e 's/"index.wasm"/"'"${runtime}"'.wasm"/' site/index.html
          test -f "site/${runtime}.pck"
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: prepare
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
