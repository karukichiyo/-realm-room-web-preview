name: Deploy Realm Room Web

on:
  push:
    branches: [main]
    paths: ['release.json', '.github/workflows/deploy-realm-room.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: realm-room-pages
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
    steps:
      - uses: actions/checkout@v4
      - name: Obtain and verify the exact tested Web build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag=$(jq -r .release_tag release.json)
          url=$(jq -r .archive_url release.json)
          checksum=$(jq -r .archive_sha256 release.json)
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release download "$tag" --pattern realm-room-web.zip --output realm-room-web.zip
          else
            curl --fail --location --retry 3 "$url" --output realm-room-web.zip
          fi
          printf '%s  realm-room-web.zip\n' "$checksum" | sha256sum --check
          python3 - <<'PY'
          import json,zipfile,pathlib,hashlib
          meta=json.load(open('release.json'))
          with zipfile.ZipFile('realm-room-web.zip') as z:
              for item in z.infolist():
                  path=pathlib.PurePosixPath(item.filename)
                  assert not path.is_absolute() and '..' not in path.parts
              z.extractall('site')
          site=pathlib.Path('site')
          assert (site/'index.html').is_file()
          pck=site/(meta['runtime']+'.pck')
          assert hashlib.sha256(pck.read_bytes()).hexdigest()==meta['pck_sha256']
          assert (site/(meta['runtime']+'.wasm')).is_file()
          PY
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" realm-room-web.zip --target "$GITHUB_SHA" --title "Realm Room preview9" --notes "Verified preview9 Web build. Account and visiting APIs use the existing live backend."
          fi
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: prepare
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
