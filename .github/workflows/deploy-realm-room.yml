name: Deploy Realm Room Web

on:
  push:
    branches: [main]
    paths: ['release.json', 'deploy/**', '.github/workflows/deploy-realm-room.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: realm-room-pages
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
    steps:
      - uses: actions/checkout@v4
      - name: Build the verified preview from the preserved base release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          base_tag=$(jq -r .base_release_tag release.json)
          archive_checksum=$(jq -r .base_archive_sha256 release.json)
          old_runtime=$(jq -r .base_runtime release.json)
          runtime=$(jq -r .runtime release.json)
          gh release download "$base_tag" --pattern realm-room-web.zip --output realm-room-web.zip
          printf '%s  realm-room-web.zip\n' "$archive_checksum" | sha256sum --check
          python3 - <<'PY'
          import zipfile,pathlib
          with zipfile.ZipFile('realm-room-web.zip') as archive:
              for item in archive.infolist():
                  path=pathlib.PurePosixPath(item.filename)
                  assert not path.is_absolute() and '..' not in path.parts
              archive.extractall('site')
          PY
          python3 deploy/patch_pck.py "site/$old_runtime.pck" "site/$runtime.pck" deploy/gdc \
            scripts/room_view.gdc scripts/material_gesture.gdc scripts/room_data.gdc \
            scripts/console_home.gdc scripts/main.gdc scripts/asset_editor.gdc \
            scripts/asset_preview_backdrop.gdc scripts/room_light_rig.gdc \
            scripts/window_surface.gdc scripts/character_life.gdc \
            scripts/environment_profile.gdc scripts/environment_profile.gd.remap \
            scripts/light_composite.gdshader
          python3 - <<'PY'
          import hashlib,json,pathlib
          meta=json.load(open('release.json'))
          site=pathlib.Path('site')
          old=meta['base_runtime']; new=meta['runtime']
          for suffix in ['.js','.wasm','.audio.worklet.js','.audio.position.worklet.js']:
              (site/(old+suffix)).rename(site/(new+suffix))
          (site/(old+'.pck')).unlink()
          index=(site/'index.html').read_text()
          index=index.replace(old,new).replace(
              f'"{new}.pck":{meta["base_pck_size"]}',
              f'"{new}.pck":{meta["pck_size"]}')
          (site/'index.html').write_text(index)
          sw=(site/'sw.js').read_text().replace(old,new)
          (site/'sw.js').write_text(sw)
          (site/'release.json').write_text(json.dumps(meta,ensure_ascii=False,indent=2)+'\n')
          pck=site/(new+'.pck')
          assert pck.stat().st_size==meta['pck_size']
          assert hashlib.sha256(pck.read_bytes()).hexdigest()==meta['pck_sha256']
          assert old not in index and old not in sw
          PY
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: prepare
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
