name: Deploy Realm Room Web

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-realm-room.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: realm-room-pages
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Download verified Godot Web build
        run: curl --fail --location --retry 3 'https://sdmntprseasia.oaiusercontent.com/files/00000000-fe08-8207-9a3b-db8e6266e4da/raw?se=2026-09-16T07%3A45%3A32Z&sp=r&sv=2026-02-06&sr=b&scid=01a0a924-4e99-7d72-9bb3-4a194a8f2786&skoid=9063adf3-a524-4acf-b70a-8731b33f2f50&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-15T22%3A15%3A52Z&ske=2026-09-16T22%3A15%3A52Z&sks=b&skv=2026-02-06&sig=WBEizFgz%2BouA9WkWEG/oHikCMHlmfBwcCuxtbvpDoNM%3D' --output realm-room-web.zip
      - name: Extract site
        run: |
          mkdir -p site
          unzip -q realm-room-web.zip -d site
          test -f site/index.html
          test -f site/index.wasm
          test -f site/index.pck
          revision="${GITHUB_SHA:0:12}"
          runtime="realm-room-${revision}"
          mv site/index.pck "site/${runtime}.pck"
          mv site/index.wasm "site/${runtime}.wasm"
          mv site/index.audio.worklet.js "site/${runtime}.audio.worklet.js"
          mv site/index.audio.position.worklet.js "site/${runtime}.audio.position.worklet.js"
          sed -i -e 's/"executable":"index"/"executable":"'"${runtime}"'"/' -e 's/"index.pck"/"'"${runtime}"'.pck"/' -e 's/"index.wasm"/"'"${runtime}"'.wasm"/' site/index.html
          test -f "site/${runtime}.pck"
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: prepare
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
